<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0d6e6e">
<title>بوابة السنتر — حسابات</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--primary:#0d6e6e;--primary-dark:#0a5555;--primary-light:#e6f5f5;--success:#198754;--danger:#dc3545;--warn:#e0a800;--bg:#f0f4f8;--card:#fff;--text:#1a2b3c;--muted:#6c7a89;--border:#d8e2ec}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:14px}
.hide{display:none!important}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#0d6e6e,#0a4a4a,#062f2f)}
.login-box{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative}
.login-box::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#0d6e6e,#c9a227,#198754)}
.login-title{font-size:20px;font-weight:bold;color:var(--primary);text-align:center;margin-bottom:6px}
.login-sub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:18px}
.field{margin-bottom:12px}
.field label,.form-group label{display:block;font-size:13px;font-weight:bold;color:var(--primary-dark);margin-bottom:5px}
.field input,.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:1.5px solid #c5d4de;border-radius:12px;min-height:44px;background:#fff}
.field input:focus,.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,110,110,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;width:100%}
.btn-primary{background:linear-gradient(135deg,#0d6e6e,#0f8a8a);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn-sm{padding:8px 12px;font-size:12px;width:auto}
.login-footer{text-align:center;margin-top:16px;font-size:11px;color:#888;line-height:1.7}
#appShell{display:none;min-height:100vh;padding-bottom:70px}
#appShell.active{display:block}
.topbar{position:sticky;top:0;z-index:100;background:var(--primary);color:#fff;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;min-height:56px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.topbar-right{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.menu-btn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);border:none;color:#fff;font-size:20px;cursor:pointer}
.topbar-title{font-size:15px;font-weight:bold}
.topbar-sub{font-size:11px;opacity:.9}
.exit-btn{width:38px;height:38px;border-radius:50%;background:#d9534f;border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.drawer{position:fixed;top:0;right:-280px;width:280px;height:100%;background:#fff;z-index:950;transition:right .25s;box-shadow:-4px 0 20px rgba(0,0,0,.15);display:flex;flex-direction:column}
.drawer.open{right:0}
.drawer-header{background:var(--primary);color:#fff;padding:20px 16px}
.drawer-user{font-weight:bold;font-size:16px}
.drawer-role{font-size:12px;opacity:.9;margin-top:4px}
.drawer-nav{flex:1;overflow-y:auto;padding:10px 0}
.nav-section{padding:10px 16px 4px;font-size:11px;color:var(--muted);font-weight:bold}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;border:none;background:transparent;text-align:right;cursor:pointer;font-size:14px;color:var(--text)}
.nav-item:hover,.nav-item.active{background:var(--primary-light);color:var(--primary)}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:940;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-overlay.show{opacity:1;pointer-events:auto}
.main{padding:14px 12px 24px;max-width:900px;margin:0 auto}
.page-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.page-header h2{font-size:18px;color:var(--primary-dark)}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:640px){.stats-grid{grid-template-columns:repeat(3,1fr)}}
.stat-card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.stat-card .stat-num{font-size:22px;font-weight:bold;color:var(--primary)}
.stat-card .stat-label{font-size:12px;color:var(--muted);margin-top:4px}
.stat-card.success .stat-num{color:var(--success)}
.stat-card.danger .stat-num{color:var(--danger)}
.stat-card.warn .stat-num{color:#b8860b}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--border)}
.card-title{font-weight:bold;color:var(--primary);margin-bottom:10px;font-size:14px}
.list-item{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;border-right:4px solid var(--primary);display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.list-item.due{border-right-color:var(--danger);background:#fff5f5}
.list-item.partial{border-right-color:var(--warn);background:#fffbf0}
.list-item.ok{border-right-color:var(--success)}
.list-item.closed{opacity:.7;border-right-color:#999}
.item-title{font-weight:bold;font-size:14px}
.item-meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.65}
.item-actions{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;background:var(--primary-light);color:var(--primary)}
.chip.green{background:#d1e7dd;color:#0f5132}
.chip.red{background:#f8d7da;color:#842029}
.chip.yellow{background:#fff3cd;color:#664d03}
.form-group{margin-bottom:10px}
.form-grid{display:grid;gap:10px}
@media(min-width:560px){.form-grid.two{grid-template-columns:1fr 1fr}}
.check-row{display:flex;align-items:center;gap:8px;padding:10px;background:#f8fafb;border-radius:10px;cursor:pointer}
.check-row input{width:18px;height:18px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:560px){.modal-overlay{align-items:center;padding:16px}.modal{border-radius:16px}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-header h3{font-size:16px;color:var(--primary)}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:2000;background:#333;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%}
.toast.show{opacity:1}
.toast.ok{background:var(--success)}
.toast.err{background:var(--danger)}
#loadingOverlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:1500;align-items:center;justify-content:center;flex-direction:column;gap:10px}
#loadingOverlay.show{display:flex}
.spinner{width:36px;height:36px;border:3px solid #ddd;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bottom-back{position:fixed;bottom:0;left:0;right:0;z-index:90;background:#fff;border-top:1px solid var(--border);padding:10px 16px;display:none;justify-content:center;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.bottom-back.show{display:flex}
.bottom-back .btn{width:auto;min-width:180px;background:#6c757d;color:#fff}
.empty-state{text-align:center;padding:30px 16px;color:var(--muted)}
.search-bar{margin-bottom:12px}
.search-bar input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px}
.cycle-row{padding:10px;border-radius:10px;margin-bottom:8px;border:1px solid var(--border);background:#fafbfc;cursor:pointer}
.cycle-row.due{background:#fff5f5;border-color:#f5c2c7}
.cycle-row.closed{background:#f1f3f5;opacity:.85}
.cycle-row .cycle-body{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.cycle-row.open .cycle-body{display:block}
.cycle-row .expand-hint{font-size:11px;color:var(--muted)}
.sess-day{font-size:12px;padding:6px 8px;background:#fff;border-radius:8px;margin-bottom:4px;border:1px solid var(--border)}
.list-item.foldable{cursor:pointer}
.list-item .fold-body{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);width:100%}
.list-item.open .fold-body{display:block}
.pull-hint{text-align:center;font-size:12px;color:var(--muted);padding:6px 0;opacity:0;transition:opacity .2s}
.pull-hint.show{opacity:1}
.filter-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filter-tabs .stat-card{cursor:pointer;flex:1;min-width:90px;transition:box-shadow .15s}
.filter-tabs .stat-card.active-filter{box-shadow:0 0 0 2px var(--primary);background:var(--primary-light)}
.session-search-item{padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff}
.session-search-item:hover{background:var(--primary-light)}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="login-box">
    <div class="login-title">بوابة السنتر</div>
    <div class="login-sub">حسابات الطلاب والمعلمين · تسجيل الجلسات</div>
    <div class="field"><label>الموبايل أو البريد</label><input id="loginPhone" autocomplete="username"></div>
    <div class="field"><label>كلمة المرور</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <div style="text-align:left;margin:-4px 0 12px;">
      <button type="button" id="forgotBtn" onclick="doForgotPassword()" style="background:none;border:none;color:#0d6e6e;font-size:13px;font-weight:bold;cursor:pointer;padding:4px 0;text-decoration:underline;">نسيت كلمة المرور؟</button>
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">دخول</button>
    <div class="login-footer">إعداد وتنفيذ: أ/ محمد فوزي<br>📱 01112221764<br>✉️ mohfawze2010@gmail.com<br>V-Finance 2.1</div>
  </div>
</div>
<div id="appShell">
  <header class="topbar">
    <div class="topbar-right">
      <button class="menu-btn" onclick="openDrawer()">☰</button>
      <div>
        <div class="topbar-title" id="topTitle">بوابة السنتر</div>
        <div class="topbar-sub" id="topSub">مالك السنتر</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button type="button" class="exit-btn" style="background:rgba(255,255,255,.2);position:relative;" onclick="showNotifPanel()" title="إشعارات">
        🔔<span id="notifBadge" style="display:none;position:absolute;top:-4px;left:-4px;background:#d9534f;color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;align-items:center;justify-content:center;font-weight:bold;"></span>
      </button>
      <button type="button" class="exit-btn" onclick="doLogout()" title="خروج">←</button>
    </div>
  </header>
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="drawer-user" id="drawerName">—</div>
      <div class="drawer-role" id="drawerRole">👑 مالك السنتر</div>
    </div>
    <nav class="drawer-nav" id="drawerNav"></nav>
  </aside>
  <main class="main" id="mainContent"></main>
  <div class="bottom-back" id="bottomBack">
    <button type="button" class="btn" onclick="goPage('home')">← رجوع للطلاب</button>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header"><h3 id="modalTitle">—</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <div id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>
<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText">...</div></div>
<div class="toast" id="toast"></div>
<script>
const firebaseConfig={
  apiKey:"AIzaSyAh3WpOZNkpUk88OAWnS5ui6IqI4VoSBwo",
  authDomain:"center-portal-26e6e.firebaseapp.com",
  projectId:"center-portal-26e6e",
  storageBucket:"center-portal-26e6e.firebasestorage.app",
  messagingSenderId:"545364801364",
  appId:"1:545364801364:web:0f5b8f5f858fbd5f19bac1",
  measurementId:"G-WE1EJR0CNJ"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
// تخزين محلي + مزامنة عند عودة الإنترنت
try{
  db.settings({ merge:true, cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED });
}catch(e){}
db.enablePersistence({ synchronizeTabs: true }).catch(err=>{
  if(err.code==="failed-precondition"){
    console.warn("Persistence: tab أخرى مفتوحة");
  }else if(err.code==="unimplemented"){
    console.warn("Persistence غير مدعوم في هذا المتصفح");
  }else{
    console.warn("Persistence:", err);
  }
});
// مؤشر حالة الاتصال
window.addEventListener("online", ()=>{ try{ toast("تمت استعادة الاتصال — جاري المزامنة","ok") }catch(e){} });
window.addEventListener("offline", ()=>{ try{ toast("وضع عدم الاتصال — البيانات تُحفظ محلياً","err") }catch(e){} });
let currentUser=null,profile=null,currentPage="home";
let cache={groups:[],teachers:[],students:[],sessions:[],payments:[],schedule:[],staff:[]};
let unsubscribers=[];
let secondaryApp=null,secondaryAuth=null;

const PERM_KEYS=[
  {key:"addStudent",label:"إضافة / تعديل طالب"},
  {key:"addTeacher",label:"إضافة / تعديل معلم"},
  {key:"manageGroups",label:"إدارة المجموعات والربط"},
  {key:"registerSession",label:"تسجيل الجلسات"},
  {key:"manageSchedule",label:"جدول اليوم"},
  {key:"collectStudent",label:"تحصيل مستحقات الطلاب"},
  {key:"payTeacher",label:"تسديد مستحقات المعلمين"},
  {key:"deleteData",label:"حذف مجموعة / عنصر"},
  {key:"wipeAll",label:"مسح البيانات بالكامل"},
  {key:"manageStaff",label:"إدارة المشرفين المساعدين"}
];
const ALL_PERMS=Object.fromEntries(PERM_KEYS.map(p=>[p.key,true]));

function isOwner(){const r=(profile?.role||"").toLowerCase();return r==="owner"||r==="super_admin"||r==="admin"}
function can(perm){
  if(!profile) return false;
  if(isOwner()) return true;
  if(profile.role==="supervisor"){
    if(profile.fullAccess) return true;
    return !!(profile.perms&&profile.perms[perm]);
  }
  return false;
}
function requirePerm(perm,msg){if(can(perm)) return true;toast(msg||"ليس لديك صلاحية لهذا الإجراء","err");return false}

const NAV=[
  {section:"المتابعة"},
  {id:"home",icon:"👨‍🎓",label:"مستحقات الطلاب"},
  {id:"teacherSettle",icon:"💵",label:"مستحقات المعلمين"},
  {id:"archive",icon:"📂",label:"أرشيف التسويات + بحث"},
  {id:"sessions",icon:"✅",label:"تسجيل جلسة",perm:"registerSession"},
  {id:"schedule",icon:"📅",label:"جدول اليوم",perm:"manageSchedule"},
  {section:"البيانات"},
  {id:"groups",icon:"🔗",label:"المجموعات (ربط)",perm:"manageGroups"},
  {id:"teachers",icon:"👨‍🏫",label:"المعلمون",perm:"addTeacher"},
  {id:"students",icon:"➕",label:"إضافة / تعديل طالب",perm:"addStudent"},
  {id:"staff",icon:"🛡️",label:"المشرفون المساعدون",perm:"manageStaff"},
  {section:"أخرى"},
  {id:"reports",icon:"📈",label:"تقارير الشهر"}
];

function isPaused(p){return !!(p&&(p.paused===true||p.active===false))}
function pauseReminderDue(p){if(!isPaused(p)||!p.pauseRemindAt) return false;return p.pauseRemindAt<=todayISO()}
function getPauseNotifications(){
  const list=[];
  (cache.students||[]).forEach(s=>{if(pauseReminderDue(s)) list.push({type:"student",id:s.id,name:s.name,msg:"تذكير: الطالب موقوف — "+(s.pauseNote||"راجع وضعه")})});
  (cache.teachers||[]).forEach(t=>{if(pauseReminderDue(t)) list.push({type:"teacher",id:t.id,name:t.name,msg:"تذكير: المعلم موقوف — "+(t.pauseNote||"راجع وضعه")})});
  return list;
}

function $(id){return document.getElementById(id)}
function showLoading(t){$("loadingText").textContent=t||"...";$("loadingOverlay").classList.add("show")}
function hideLoading(){$("loadingOverlay").classList.remove("show")}
function toast(msg,type){const el=$("toast");el.textContent=msg;el.className="toast show "+(type||"");setTimeout(()=>el.classList.remove("show"),3000)}
function sanitize(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function phoneToEmail(input){const t=String(input||"").trim();if(t.includes("@"))return t.toLowerCase();const d=t.replace(/[^0-9]/g,"");return(d||"user")+"@center.local"}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function monthKey(d){return (d||todayISO()).slice(0,7)}
function fmtDate(v){if(!v)return"—";if(typeof v==="number")return new Date(v).toLocaleDateString("ar-EG");return String(v)}
function money(n){return Number(n||0).toLocaleString("en-US")}
function openDrawer(){$("drawer").classList.add("open");$("drawerOverlay").classList.add("show")}
function closeDrawer(){$("drawer").classList.remove("open");$("drawerOverlay").classList.remove("show")}
function openModal(title,body,footer){$("modalTitle").textContent=title;$("modalBody").innerHTML=body;$("modalFooter").innerHTML=footer||`<button class="btn btn-outline btn-sm" onclick="closeModal()">إغلاق</button>`;$("modalOverlay").classList.add("show")}
function closeModal(){$("modalOverlay").classList.remove("show")}
function getSecondaryAuth(){if(!secondaryAuth){secondaryApp=firebase.initializeApp(firebaseConfig,"SecondaryStaff");secondaryAuth=secondaryApp.auth()}return secondaryAuth}

function buildDrawer(){
  let html="";
  NAV.forEach(item=>{
    if(item.section){html+=`<div class="nav-section">${item.section}</div>`;return}
    if(item.perm&&!can(item.perm)) return;
    html+=`<button class="nav-item ${currentPage===item.id?"active":""}" onclick="goPage('${item.id}')"><span>${item.icon}</span><span>${item.label}</span></button>`;
  });
  $("drawerNav").innerHTML=html;
  $("drawerName").textContent=profile?.name||"—";
  const roleEl=$("drawerRole");
  if(roleEl) roleEl.textContent=isOwner()?"👑 مالك السنتر":"🛡️ مشرف مساعد";
}
function goPage(id){
  const item=NAV.find(n=>n.id===id);
  if(item?.perm&&!can(item.perm)){toast("ليس لديك صلاحية لفتح هذه الصفحة","err");return}
  currentPage=id;closeDrawer();buildDrawer();renderPage();
  $("bottomBack").classList.toggle("show",id!=="home");
  window.scrollTo(0,0);
}

async function doLogin(){
  const phone=$("loginPhone").value.trim(),pass=$("loginPass").value;
  if(!phone||!pass){toast("أدخل البيانات","err");return}
  $("loginBtn").disabled=true;$("loginBtn").textContent="...";
  try{await auth.signInWithEmailAndPassword(phoneToEmail(phone),pass)}
  catch(e){toast("فشل الدخول","err");$("loginBtn").disabled=false;$("loginBtn").textContent="دخول"}
}
async function doForgotPassword(){
  const input=($("loginPhone")?.value||"").trim();
  if(!input){toast("اكتب البريد أو الموبايل أولاً","err");return}
  // رابط الاستعادة يعمل فقط مع بريد حقيقي مسجّل في Authentication
  let email=input;
  if(!input.includes("@")){
    toast("للاستعادة اكتب البريد الإلكتروني المسجّل للحساب (وليس الموبايل فقط)","err");
    return;
  }
  email=input.toLowerCase();
  const btn=$("forgotBtn");

let pullStartY=0,pulling=false;
function setupPullRefresh(){
  const main=$("mainContent");
  if(!main||main.dataset.pullBound) return;
  main.dataset.pullBound="1";
  let hint=document.getElementById("pullHint");
  if(!hint){
    hint=document.createElement("div");
    hint.id="pullHint";
    hint.className="pull-hint";
    hint.textContent="↓ اسحب للتحديث";
    main.parentNode.insertBefore(hint,main);
  }
  main.addEventListener("touchstart",e=>{
    if(window.scrollY<=0){pullStartY=e.touches[0].clientY;pulling=true}
  },{passive:true});
  main.addEventListener("touchmove",e=>{
    if(!pulling) return;
    const dy=e.touches[0].clientY-pullStartY;
    if(dy>60) hint.classList.add("show");
  },{passive:true});
  main.addEventListener("touchend",async e=>{
    if(!pulling) return;
    pulling=false;
    const dy=(e.changedTouches[0].clientY-pullStartY);
    hint.classList.remove("show");
    if(dy>80 && window.scrollY<=2){
      hint.textContent="جاري التحديث...";hint.classList.add("show");
      try{await loadAll();renderPage();toast("تم التحديث","ok")}
      catch(err){toast("تعذر التحديث","err")}
      hint.classList.remove("show");hint.textContent="↓ اسحب للتحديث";
    }
  },{passive:true});
}

function listenRealtime(){
  unsubscribers.forEach(u=>{try{u()}catch(e){}});
  unsubscribers=[];
  const cols=["center_groups","center_teachers","center_students","center_sessions","center_payments","center_schedule"];
  const keys=["groups","teachers","students","sessions","payments","schedule"];
  cols.forEach((col,i)=>{
    unsubscribers.push(db.collection(col).onSnapshot(snap=>{
      cache[keys[i]]=snap.docs.map(d=>({id:d.id,...d.data()}));
      if(keys[i]==="sessions") cache.sessions.sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.createdAt||0)-(b.createdAt||0));
      if(keys[i]==="payments") cache.payments.sort((a,b)=>(b.at||0)-(a.at||0));
      renderPage();
    },e=>console.warn(col,e)));
  });
  unsubscribers.push(db.collection("center_users").onSnapshot(snap=>{
    cache.staff=snap.docs.map(d=>({id:d.id,...d.data()})).filter(u=>(u.role||"")==="supervisor");

  },e=>console.warn("users",e)));

function isSessionOk(s){return !s.status||s.status==="approved"}
function teacherSessionAmount(t,session){
  if((t.payMode||"fixed")==="per_student"){
    const present=(session.attendance||[]).filter(a=>a.status==="present").length;
    return present*Number(t.ratePerStudent||t.ratePerSession||0);
  }
  return Number(session.rateAtTime!=null?session.rateAtTime:t.ratePerSession||0);
}
function sessionsFor(teacherId,groupId){
  return (cache.sessions||[]).filter(s=>isSessionOk(s)&&(s.teacherId===teacherId)&&(!groupId||s.groupId===groupId));
}
function buildTeacherCycles(teacher,groupId){
  const cycleSize=Math.max(1,Number(teacher.sessionsPerCycle)||8);
  const all=sessionsFor(teacher.id,groupId);
  if(!all.length) return [];
  const pays=(cache.payments||[]).filter(p=>p.type==="teacher_payment"&&p.teacherId===teacher.id&&p.groupId===groupId);
  const cycles=[];
  for(let c=0;c<Math.ceil(all.length/cycleSize);c++){
    const slice=all.slice(c*cycleSize,(c+1)*cycleSize);
    const amount=slice.reduce((sum,s)=>sum+teacherSessionAmount(teacher,s),0);
    const cyclePays=pays.filter(p=>Number(p.cycleIndex)===c);
    const paid=cyclePays.reduce((sum,p)=>sum+Number(p.amount||0),0);
    const lastPay=cyclePays.sort((a,b)=>(b.at||0)-(a.at||0))[0];
    const full=slice.length>=cycleSize;
    const closed=!!(teacher.closedCycles&&teacher.closedCycles[groupId]&&teacher.closedCycles[groupId][c]);
    const remaining=Math.max(0,amount-paid);
    cycles.push({
      cycleIndex:c,cycleNum:c+1,sessions:slice.length,cycleSize,full,amount,paid,remaining,
      closed:!!closed,
      lastPayDate:lastPay?(lastPay.payDate||fmtDate(lastPay.at)):null,
      lastPayNote:lastPay?(lastPay.note||""):"",
      groupId,teacherId:teacher.id,
      sessionDetails:slice.map((s,i)=>({
        n:i+1,date:s.date||"—",time:s.time||"",
        present:(s.attendance||[]).filter(a=>a.status==="present").length,
        absent:(s.attendance||[]).filter(a=>a.status==="absent").length,
        amount:teacherSessionAmount(teacher,s),note:s.note||""
      }))
    });
  }
  return cycles;
}
function studentBillableSessions(student,en){
  return (cache.sessions||[]).filter(sess=>{
    if(!isSessionOk(sess)||sess.groupId!==en.groupId) return false;
    const att=(sess.attendance||[]).find(a=>a.studentId===student.id);
    if(!att) return false;
    if(att.status==="present") return true;
    return en.chargeOnAbsence===true&&att.status==="absent";
  }).map(sess=>{
    const att=(sess.attendance||[]).find(a=>a.studentId===student.id);
    return {date:sess.date||"—",time:sess.time||"",status:att?.status||"",note:sess.note||""};
  });
}
function studentBillableCount(student,en){return studentBillableSessions(student,en).length}
function teacherDueScore(t){
  let score=0,dueAmount=0,fullPending=0;
  cache.groups.filter(g=>(g.teacherIds||[]).includes(t.id)).forEach(g=>{
    buildTeacherCycles(t,g.id).forEach(cy=>{
      if(cy.closed) return;
      if(cy.full&&cy.remaining>0){fullPending++;dueAmount+=cy.remaining;score+=1000+cy.remaining}
      else if(cy.remaining>0){dueAmount+=cy.remaining;score+=cy.remaining}
      else if(cy.full) score+=50;
      else if(cy.sessions>0) score+=1;
    });
  });
  return {score,dueAmount,fullPending};
}
function countMonths(startStr){
  if(!startStr) return 1;
  const start=new Date(startStr),now=new Date();
  if(isNaN(start.getTime())) return 1;
  return Math.max(1,(now.getFullYear()-start.getFullYear())*12+(now.getMonth()-start.getMonth())+1);
}
function studentRequired(s){
  let req=0;
  (s.enrollments||[]).forEach(e=>{
    if(e.type==="monthly") req+=countMonths(e.startDate||e.enrolledAt)*Number(e.monthlyPrice||0);
    else req+=studentBillableCount(s,e)*Number(e.sessionRate||0);
  });
  return req;
}
function studentPaid(s){
  return (cache.payments||[]).filter(p=>p.type==="student_payment"&&p.studentId===s.id).reduce((sum,p)=>sum+Number(p.amount||0),0);
}
/** هل حان موعد إظهار المستحق؟ مقدم=من البداية، مؤخر=بعد يوم الدفع من الشهر */
function studentIsDueNow(s){
  const ens=s.enrollments||[];
  if(!ens.length) return false;
  const today=new Date();
  const day=today.getDate();
  // لو أي تسجيل مؤخر ولم يأتِ يوم الدفع بعد، وباقي الأشهر السابقة محسوبة في المطلوب
  let any=false;
  ens.forEach(e=>{
    any=true;
    const timing=e.payTiming||"advance"; // advance | defer
    const payDay=Math.min(28, Math.max(1, Number(e.payDay)||1));
    if(e.type==="monthly" && timing==="defer" && day<payDay){
      // هذا الشهر لم يحن بعد — نخصم شهر واحد من "الظهور" فقط إن كان المطلوب من شهر واحد جاري
      // الظهور: false إذا كل المستحق من الشهر الحالي فقط
    }
  });
  const f={required:studentRequired(s),paid:studentPaid(s)};
  const unpaid=Math.max(0,f.required-f.paid);
  if(unpaid<=0) return false;
  // تحقق: لو كل الاشتراكات مؤخرة ولم يأتِ يوم الدفع، أخفِ إن كان المدفوع يغطي كل الأشهر ما عدا الحالي
  let hide=true;
  ens.forEach(e=>{
    const timing=e.payTiming||"advance";
    const payDay=Math.min(28, Math.max(1, Number(e.payDay)||1));
    if(e.type!=="monthly"){ hide=false; return; }
    if(timing==="advance"){ hide=false; return; }
    if(day>=payDay){ hide=false; return; }
    // مؤخر ولم يأتِ اليوم: لو عليه أكثر من شهر واحد يظهر
    const months=countMonths(e.startDate||e.enrolledAt);
    if(months>1) hide=false;
  });
  return !hide;
}
function studentFinance(s){
  const required=studentRequired(s),paid=studentPaid(s);
  let dueSessions=0;
  (s.enrollments||[]).forEach(e=>{if(e.type!=="monthly") dueSessions+=studentBillableCount(s,e)});
  const unpaid=Math.max(0,required-paid);
  const showDue=unpaid>0 && studentIsDueNow(s);
  // متوقع هذا الشهر من هذا الطالب
  let expectedThisMonth=0;
  (s.enrollments||[]).forEach(e=>{
    if(e.type==="monthly") expectedThisMonth+=Number(e.monthlyPrice||0);
    else expectedThisMonth+=Number(e.sessionRate||0); // تقديري حصة — أو الباقة موزعة
  });
  return {required,paid,unpaid,dueSessions,showDue,expectedThisMonth};
}

let teacherShowArch=false;
function renderTeacherSettle(){
  if(!cache.teachers.length) return `<div class="page-header"><h2>💵 مستحقات المعلمين</h2></div><div class="empty-state"><p>لا معلمون</p></div>`;
  const sorted=[...cache.teachers].filter(t=>!isPaused(t)).map(t=>({t,sc:teacherDueScore(t)}))
    .filter(x=>x.sc.score>0||x.sc.dueAmount>0).sort((a,b)=>b.sc.score-a.sc.score||b.sc.dueAmount-a.sc.dueAmount);
  let html=`<div class="page-header"><h2>💵 مستحقات المعلمين</h2>
    <button class="btn btn-outline btn-sm" onclick="teacherShowArch=!teacherShowArch;renderPage()">📂 ${typeof teacherShowArch!=="undefined"&&teacherShowArch?"إخفاء المنتهية":"أرشيف المنتهية"}</button></div>
  <p style="font-size:12px;color:var(--muted);margin-bottom:12px">الجارية بالخارج · إنهاء التسوية يخفيها من الملخص · أحمر=متبقي · أخضر عند السداد الكامل</p>`;
  if(!sorted.length) return html+`<div class="empty-state"><p>لا مستحقات جارية للمعلمين 🎉</p></div>`;
  sorted.forEach(({t,sc})=>{
    const groups=cache.groups.filter(g=>(g.teacherIds||[]).includes(t.id));
    html+=`<div class="card"><div class="card-title">👨‍🏫 ${sanitize(t.name)}
      ${sc.fullPending?`<span class="chip red">${sc.fullPending} واجبة السداد</span>`:""}
      <span class="chip">${(t.billingCycle==="monthly")?"شهري":"كل "+(t.sessionsPerCycle||8)+" حصة"}</span></div>`;
    groups.forEach(g=>{
      const cycles=buildTeacherCycles(t,g.id).filter(cy=>teacherShowArch?cy.closed:!cy.closed);
      if(!cycles.length) return;
      cycles.sort((a,b)=>{
        const sa=(a.full&&a.remaining>0)?2:(a.remaining>0?1:0);
        const sb=(b.full&&b.remaining>0)?2:(b.remaining>0?1:0);
        return sb-sa||b.cycleIndex-a.cycleIndex;
      });
      html+=`<div style="margin:10px 0 6px;font-size:13px;font-weight:bold;color:var(--primary-dark)">📚 ${sanitize(g.name)}</div>`;
      cycles.forEach(cy=>{
        const cls=cy.remaining>0?"due":(cy.paid>0?"ok":"");
        const daysHtml=cy.sessionDetails.map(d=>`<div class="sess-day">${d.n}) ${sanitize(d.date)}${d.time?" · "+sanitize(d.time):""} · حاضر ${d.present}${d.absent?` · غائب ${d.absent}`:""} · ${money(d.amount)} ج</div>`).join("");
        html+=`<div class="cycle-row ${cls}" onclick="this.classList.toggle('open')">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center">
            <div><b>تسوية ${cy.cycleNum}</b>
              ${cy.full?`<span class="chip red">مكتملة ${cy.sessions}/${cy.cycleSize}</span>`:`<span class="chip">${cy.sessions}/${cy.cycleSize}</span>`}
              <span class="expand-hint">— اضغط للتفاصيل</span>
              <div class="item-meta">المبلغ: ${money(cy.amount)} ج · مدفوع: ${money(cy.paid)} ج
                ${cy.remaining>0?` · <b style="color:var(--danger)">باقي ${money(cy.remaining)}</b>`:" · خالص — يمكنك إنهاؤها"}
                ${cy.lastPayDate?`<br>تاريخ التسديد: <b>${sanitize(cy.lastPayDate)}</b>`:""}
                ${cy.lastPayNote?` · ${sanitize(cy.lastPayNote)}`:""}</div></div>
            <div class="item-actions" onclick="event.stopPropagation()">
              ${can("payTeacher")&&cy.amount>0&&cy.remaining>0?`<button class="btn btn-success btn-sm" onclick="openTeacherPay('${t.id}','${g.id}',${cy.cycleIndex},${cy.remaining})">تسديد المستحقات</button>`:""}
              ${can("payTeacher")?`<button class="btn btn-outline btn-sm" onclick="closeCycle('${t.id}','${g.id}',${cy.cycleIndex})">إنهاء التسوية</button>`:""}
            </div>
          </div>
          <div class="cycle-body" onclick="event.stopPropagation()">
            <div style="font-size:12px;font-weight:bold;margin-bottom:6px;color:var(--primary)">أيام الجلسات (${cy.sessions})</div>${daysHtml}
          </div></div>`;
      });
    });
    html+=`</div>`;
  });
  return html;
}

function renderArchive(){
  const q=($("archQ")?.value||"").trim().toLowerCase();
  let html=`<div class="page-header"><h2>📂 أرشيف التسويات</h2></div>
  <div class="search-bar"><input id="archQ" placeholder="ابحث باسم طالب أو معلم..." value="${sanitize(q)}" oninput="renderPage()"></div>
  <p style="font-size:12px;color:var(--muted);margin-bottom:12px">كل التسويات (جارية + منتهية). ابحث لتظهر كل سجلّات الشخص.</p>`;
  cache.teachers.filter(t=>!q||(t.name||"").toLowerCase().includes(q)).forEach(t=>{
    const groups=cache.groups.filter(g=>(g.teacherIds||[]).includes(t.id));
    let block="";
    groups.forEach(g=>{
      const cycles=buildTeacherCycles(t,g.id);
      if(!cycles.length) return;
      block+=`<div style="margin:8px 0 4px;font-size:13px;font-weight:bold">📚 ${sanitize(g.name)}</div>`;
      cycles.forEach(cy=>{
        const cls=cy.closed?"closed":(cy.full&&cy.remaining>0?"due":"");
        const days=cy.sessionDetails.map(d=>`<div class="sess-day">${d.n}) ${sanitize(d.date)}${d.time?" · "+sanitize(d.time):""}</div>`).join("");
        block+=`<div class="cycle-row ${cls}" onclick="this.classList.toggle('open')">
          <b>تسوية ${cy.cycleNum}</b> ${cy.sessions}/${cy.cycleSize} ${cy.closed?`<span class="chip green">منتهية</span>`:""}
          <div class="item-meta">${money(cy.amount)} ج · مدفوع ${money(cy.paid)}${cy.lastPayDate?" · "+sanitize(cy.lastPayDate):""}${cy.lastPayNote?" · "+sanitize(cy.lastPayNote):""}</div>
          <div class="cycle-body">${days}</div></div>`;
      });
    });
    if(block||q) html+=`<div class="card"><div class="card-title">👨‍🏫 ${sanitize(t.name)} ${isPaused(t)?'<span class="chip red">موقوف</span>':""}</div>${block||"<p style='font-size:12px;color:var(--muted)'>لا تسويات</p>"}</div>`;
  });
  cache.students.filter(s=>!q||(s.name||"").toLowerCase().includes(q)).forEach(s=>{
    const f=studentFinance(s);
    const pays=(cache.payments||[]).filter(p=>p.type==="student_payment"&&p.studentId===s.id);
    if(!q&&f.unpaid<=0&&!pays.length) return;
    let sess="";
    (s.enrollments||[]).forEach(e=>{
      const g=cache.groups.find(x=>x.id===e.groupId);
      const days=studentBillableSessions(s,e);
      if(!days.length) return;
      sess+=`<div style="margin:6px 0"><b>${sanitize(g?.name||"")}</b></div>`;
      days.forEach((d,i)=>{sess+=`<div class="sess-day">${i+1}) ${sanitize(d.date)}</div>`});
    });
    const payLines=pays.map(p=>`<div class="sess-day">استلام ${money(p.amount)} ج · ${sanitize(p.payDate||fmtDate(p.at))}${p.note?" · "+sanitize(p.note):""}</div>`).join("");
    html+=`<div class="card list-item foldable ${f.unpaid>0?"due":"ok"}" onclick="this.classList.toggle('open')">
      <div style="flex:1"><div class="item-title">👨‍🎓 ${sanitize(s.name)} ${isPaused(s)?'<span class="chip red">موقوف</span>':""}</div>
      <div class="item-meta">مطلوب ${money(f.required)} · مدفوع ${money(f.paid)} · ${f.unpaid>0?`<b style="color:var(--danger)">باقي ${money(f.unpaid)}</b>`:`<span class="chip green">خالص / منتهٍ</span>`}</div></div>
      <div class="fold-body" onclick="event.stopPropagation()">
        <div style="font-weight:bold;font-size:12px;margin-bottom:6px">الحصص</div>${sess||"<p style='font-size:12px;color:var(--muted)'>لا حصص</p>"}
        <div style="font-weight:bold;font-size:12px;margin:10px 0 6px">عمليات الاستلام</div>${payLines||"<p style='font-size:12px;color:var(--muted)'>لا استلامات</p>"}
      </div></div>`;
  });
  return html;
}

function openTeacherPay(teacherId,groupId,cycleIndex,suggested){
  if(!requirePerm("payTeacher")) return;
  const t=cache.teachers.find(x=>x.id===teacherId);
  const g=cache.groups.find(x=>x.id===groupId);
  openModal("تسديد مستحقات — "+(t?.name||""),`
    <p style="font-size:13px;margin-bottom:10px">المجموعة: <b>${sanitize(g?.name||"")}</b> · تسوية رقم ${cycleIndex+1}</p>
    <div class="form-group"><label>المبلغ (ج) *</label><input type="number" id="tpAmt" min="0" value="${Number(suggested)||0}"></div>
    <div class="form-group"><label>تاريخ التسديد *</label><input type="date" id="tpDate" value="${todayISO()}"></div>
    <div class="form-group"><label>ملاحظة</label><input id="tpNote" placeholder="تسديد دورة 8 حصص..."></div>
  `,`<button class="btn btn-outline btn-sm" onclick="closeModal()">إلغاء</button>
    <button class="btn btn-success btn-sm" onclick="saveTeacherPay('${teacherId}','${groupId}',${cycleIndex})">حفظ التسديد</button>`);
}
async function saveTeacherPay(teacherId,groupId,cycleIndex){
  if(!requirePerm("payTeacher")) return;
  const amount=Number($("tpAmt").value)||0;
  const payDate=$("tpDate").value||todayISO();
  if(amount<=0){toast("أدخل مبلغاً","err");return}
  const t=cache.teachers.find(x=>x.id===teacherId);
  const g=cache.groups.find(x=>x.id===groupId);
  try{
    await db.collection("center_payments").add({type:"teacher_payment",teacherId,groupId,cycleIndex,teacherName:t?.name||"",groupName:g?.name||"",amount,payDate,note:$("tpNote").value.trim(),at:Date.now(),by:currentUser.uid});
    closeModal();toast("تم تسجيل الدفع","ok");
  }catch(e){toast(e.message,"err")}
}
async function closeCycle(teacherId,groupId,cycleIndex){
  if(!requirePerm("payTeacher")) return;
  if(!confirm("إنهاء التسوية وإخفاؤها من الملخص الخارجي؟")) return;
  const t=cache.teachers.find(x=>x.id===teacherId);
  const closed={...(t.closedCycles||{})};
  if(!closed[groupId]) closed[groupId]={};
  closed[groupId][cycleIndex]=true;
  try{await db.collection("center_teachers").doc(teacherId).update({closedCycles:closed,updatedAt:Date.now()});toast("تم إنهاء التسوية","ok")}
  catch(e){toast(e.message,"err")}
}

async function saveGroup(id){

async function saveStudent(id){
  if(!requirePerm("addStudent")) return;
  const name=$("sName").value.trim();
  if(!name){toast("الاسم مطلوب","err");return}
  const data={name,phone:$("sPhone").value.trim(),parentName:$("sParent").value.trim(),updatedAt:Date.now()};
  const groupId=$("sGroup")?.value||"";
  let enrollments=id?(cache.students.find(x=>x.id===id)?.enrollments||[]):[];
  enrollments=[...enrollments];
  if(groupId){
    const g=cache.groups.find(x=>x.id===groupId);
    const teacherId=(g?.teacherIds||[])[0];
    if(!teacherId){toast("المجموعة بلا معلم","err");return}
    if(isPaused(cache.teachers.find(x=>x.id===teacherId))){toast("المعلم موقوف","err");return}
    const type=$("sBillType").value;
    const entry={groupId,teacherId,type,chargeOnAbsence:!!$("sAbs")?.checked,enrolledAt:todayISO(),
      payTiming:$("sPayTiming")?.value||"advance",
      payDay:Math.min(28,Math.max(1,Number($("sPayDay")?.value)||5))
    };
    if(type==="monthly"){entry.monthlyPrice=Number($("sMonth").value)||0;entry.startDate=$("sStart").value||todayISO()}
    else {
      const packTotal=Number($("sPackTotal")?.value)||0;
      const packCnt=Math.max(1,Number($("sPackCnt")?.value)||1);
      entry.packageTotal=packTotal;
      entry.packageSessions=packCnt;
      entry.sessionRate=Math.round((packTotal/packCnt)*100)/100 || Number($("sRate")?.value)||0;
    }
    const i=enrollments.findIndex(e=>e.groupId===groupId);
    if(i>=0) enrollments[i]=entry; else enrollments.push(entry);
  }
  data.enrollments=enrollments;
  try{
    showLoading("جاري الحفظ...");
    if(id) await db.collection("center_students").doc(id).update(data);
    else await db.collection("center_students").add({...data,paused:false,createdAt:Date.now()});
    closeModal();toast("تم حفظ الطالب والحساب","ok");
  }catch(e){toast(e.message,"err")}
  hideLoading();
}

async function importStudentsExcel(ev){
  const file=ev.target.files&&ev.target.files[0];
  ev.target.value="";
  if(!file) return;
  if(!requirePerm("addStudent")) return;
  try{
    showLoading("جاري قراءة الملف...");
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array"});
    const sheet=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(sheet,{defval:""});
    if(!rows.length){toast("الملف فارغ","err");hideLoading();return}
    let ok=0, skip=0, err=0;
    for(const row of rows){
      const name=String(row["الاسم*"]||row["الاسم"]||row["name"]||"").trim();
      if(!name||name.startsWith("مثال")){skip++;continue}
      const phone=String(row["الموبايل"]||row["phone"]||"").trim();
      const parent=String(row["ولي_الأمر"]||row["ولي الأمر"]||row["parent"]||"").trim();
      const gName=String(row["اسم_المجموعة"]||row["المجموعة"]||"").trim();
      const billRaw=String(row["طريقة_الحساب"]||row["الحساب"]||"حصة").trim();
      const isMonth=/شهر|monthly/i.test(billRaw);
      const packTotal=Number(row["اجمالي_الباقة"]||row["إجمالي_الباقة"]||row["اجمالي"]||0)||0;
      const packCnt=Math.max(1,Number(row["عدد_حصص_الباقة"]||row["عدد_الحصص"]||8)||8);
      let rate=Number(row["مبلغ_الحصة"]||row["سعر_الحصة"]||0)||0;
      if(packTotal>0) rate=Math.round((packTotal/packCnt)*100)/100;
      const monthPrice=Number(row["قيمة_الشهر"]||row["الاشتراك"]||0)||0;
      const start=String(row["بداية_الاشتراك"]||"").trim()||todayISO();
      const absRaw=String(row["محاسبة_الغياب"]||"").trim();
      const chargeOnAbsence=/نعم|yes|1|true/i.test(absRaw);
      const enrollments=[];
      if(gName){
        const g=cache.groups.find(x=>(x.name||"").trim()===gName);
        if(g){
          const teacherId=(g.teacherIds||[])[0];
          if(teacherId&&!isPaused(cache.teachers.find(x=>x.id===teacherId))){
            const entry={groupId:g.id,teacherId,type:isMonth?"monthly":"session",chargeOnAbsence,enrolledAt:todayISO()};
            if(isMonth){entry.monthlyPrice=monthPrice;entry.startDate=start}
            else {entry.sessionRate=rate||50; if(packTotal>0){entry.packageTotal=packTotal;entry.packageSessions=packCnt}}
            enrollments.push(entry);
          }
        }
      }
      try{
        await db.collection("center_students").add({
          name,phone,parentName:parent,enrollments,paused:false,createdAt:Date.now(),updatedAt:Date.now()
        });
        ok++;
      }catch(e){err++;console.warn(e)}
    }
    hideLoading();
    toast(`تم: ${ok} · تخطي ${skip} · خطأ ${err}`,"ok");
  }catch(e){hideLoading();toast("فشل قراءة الملف: "+(e.message||e),"err")}
}

  const groupId=$("enGroup").value;
  if(!groupId){toast("اختر مجموعة","err");return}
  const g=cache.groups.find(x=>x.id===groupId);
  const teacherId=(g?.teacherIds||[])[0];
  if(!teacherId){toast("المجموعة بلا معلم","err");return}
  if(isPaused(cache.teachers.find(x=>x.id===teacherId))){toast("المعلم موقوف","err");return}
  const type=$("enType").value;
  const entry={groupId,teacherId,type,chargeOnAbsence:!!$("enAbs")?.checked,enrolledAt:todayISO(),payTiming:$("enPayTiming")?.value||"advance",payDay:Math.min(28,Math.max(1,Number($("enPayDay")?.value)||5))};
  if(type==="monthly"){entry.monthlyPrice=Number($("enMonth").value)||0;entry.startDate=$("enStart").value||todayISO()}
  else {
    const packTotal=Number($("enPackTotal")?.value)||0;
    const packCnt=Math.max(1,Number($("enPackCnt")?.value)||1);
    entry.packageTotal=packTotal;
    entry.packageSessions=packCnt;
    entry.sessionRate=Math.round((packTotal/packCnt)*100)/100 || Number($("enRate")?.value)||0;
  }
  let ens=[...(s.enrollments||[])];
  const i=ens.findIndex(e=>e.groupId===groupId);
  if(i>=0) ens[i]=entry; else ens.push(entry);
  try{await db.collection("center_students").doc(studentId).update({enrollments:ens,updatedAt:Date.now()});closeModal();toast("تم الربط","ok")}
  catch(e){toast(e.message,"err")}
}

function onSessionSearch(){
  const q=($("seSearch")?.value||"").trim().toLowerCase();
  const box=$("seSearchResults");
  if(!box) return;
  if(q.length<1){box.innerHTML="";return}
  const hits=[];
  cache.groups.forEach(g=>{
    const te=cache.teachers.find(x=>(g.teacherIds||[]).includes(x.id));
    if((g.name||"").toLowerCase().includes(q)||(te?.name||"").toLowerCase().includes(q))
      hits.push({type:"group",id:g.id,label:`مجموعة: ${g.name} — ${te?.name||""}`});
  });
  cache.teachers.filter(x=>!isPaused(x)).forEach(te=>{
    if((te.name||"").toLowerCase().includes(q))
      hits.push({type:"teacher",id:te.id,label:`معلم: ${te.name}`});
  });
  cache.students.filter(x=>!isPaused(x)).forEach(st=>{
    if((st.name||"").toLowerCase().includes(q))
      hits.push({type:"student",id:st.id,label:`طالب: ${st.name}`});
  });
  box.innerHTML=hits.slice(0,12).map(h=>`
    <div class="session-search-item" onclick="pickSessionSearch('${h.type}','${h.id}')">${sanitize(h.label)}</div>
  `).join("")||`<p style="font-size:12px;color:var(--muted)">لا نتائج</p>`;

    const st=cache.students.find(x=>x.id===id);
    groupId=(st?.enrollments||[])[0]?.groupId||"";

  if(!requirePerm("manageStaff")) return;
  const name=$("stName").value.trim();
  if(!name){toast("الاسم مطلوب","err");return}
  const full=!!$("stFull")?.checked;
  const perms={};
  PERM_KEYS.forEach(p=>{perms[p.key]=full||!!document.querySelector(`.permChk[value="${p.key}"]`)?.checked});
  try{
    showLoading("جاري الحفظ...");

      await db.collection("center_users").doc(id).update({name,fullAccess:full,perms,updatedAt:Date.now()});

function payDateStr(p){
  if(p.payDate) return String(p.payDate).slice(0,10);
  if(p.at) return new Date(p.at).toISOString().slice(0,10);
  return "";
}
function inRange(dateStr, from, to){
  if(!dateStr) return false;
  const d=String(dateStr).slice(0,10);
  if(from && d<from) return false;
  if(to && d>to) return false;
  return true;
}
let reportRange={from:"",to:""};
function getReportRange(){
  if(!reportRange.from||!reportRange.to) defaultReportRange();
  return {from:reportRange.from,to:reportRange.to};
}
function defaultReportRange(){
  const now=new Date();
  const y=now.getFullYear(), m=String(now.getMonth()+1).padStart(2,"0");
  reportRange.from=y+"-"+m+"-01";
  reportRange.to=todayISO();
}
function applyReportDates(){
  const f=$("repFrom")?.value, to=$("repTo")?.value;
  if(f) reportRange.from=f;
  if(to) reportRange.to=to;
  renderPage();
}

function paymentsInRange(type){
  const {from,to}=getReportRange();
  return (cache.payments||[]).filter(p=>{
    if(type && p.type!==type) return false;
    return inRange(payDateStr(p), from, to);
  });
}
function sessionsInRange(){
  const {from,to}=getReportRange();
  return (cache.sessions||[]).filter(s=>isSessionOk(s)&&inRange(s.date, from, to));
}

    <button class="btn btn-outline btn-sm" onclick="exportExcel()">📥 إكسل</button></div>
  <div class="card">
    <div class="card-title">الفترة</div>
    <div class="form-grid two">
      <div class="form-group"><label>من تاريخ</label><input type="date" id="repFrom" value="${sanitize(from)}" onchange="applyReportDates()"></div>
      <div class="form-group"><label>إلى تاريخ</label><input type="date" id="repTo" value="${sanitize(to)}" onchange="applyReportDates()"></div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">
      <button type="button" class="btn btn-outline btn-sm" onclick="setReportPreset('month')">هذا الشهر</button>
      <button type="button" class="btn btn-outline btn-sm" onclick="setReportPreset('lastMonth')">الشهر الماضي</button>
      <button type="button" class="btn btn-outline btn-sm" onclick="setReportPreset('year')">هذه السنة</button>
    </div>
  </div>
  <div class="stats-grid">
    <div class="stat-card success" style="cursor:pointer" onclick="showReportDetails('collect')">
      <div class="stat-num">${money(collected)}</div>
      <div class="stat-label">المتحصَّل من الطلاب — اضغط للتفاصيل</div>
    </div>
    <div class="stat-card warn" style="cursor:pointer" onclick="showReportDetails('teachers')">
      <div class="stat-num">${money(paidTeachers)}</div>
      <div class="stat-label">مدفوع للمعلمين — اضغط للتفاصيل</div>
    </div>
    <div class="stat-card ${profit>=0?"success":"danger"}" style="cursor:pointer" onclick="showReportDetails('profit')">
      <div class="stat-num">${money(profit)}</div>
      <div class="stat-label">الربح (تحصيل − صرف)</div>
    </div>
    <div class="stat-card" style="cursor:pointer" onclick="showReportDetails('sessions')">
      <div class="stat-num">${sessCount}</div>
      <div class="stat-label">جلسات مسجّلة في الفترة — اضغط</div>
    </div>
  </div>
  <p style="font-size:12px;color:var(--muted);margin:8px 0 12px">من ${sanitize(from||"—")} إلى ${sanitize(to||"—")}</p>
  ${wipe}`;
}
function setReportPreset(kind){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth();
  if(kind==="month"){
    reportRange.from=y+"-"+String(m+1).padStart(2,"0")+"-01";
    reportRange.to=todayISO();
  }else if(kind==="lastMonth"){
    const d=new Date(y,m,0);
    reportRange.from=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-01";
    reportRange.to=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }else if(kind==="year"){
    reportRange.from=y+"-01-01";
    reportRange.to=todayISO();
  }
  renderPage();
}
function showReportDetails(kind){
  const {from,to}=getReportRange();
  if(kind==="collect"){
    const list=paymentsInRange("student_payment").sort((a,b)=>payDateStr(b).localeCompare(payDateStr(a)));
    const body=list.length?list.map(p=>`
      <div class="list-item ok"><div>
        <div class="item-title">${sanitize(p.studentName||"طالب")}</div>
        <div class="item-meta">${money(p.amount)} ج · ${sanitize(payDateStr(p))}${p.note?" · "+sanitize(p.note):""}</div>
      </div></div>`).join(""):`<div class="empty-state"><p>لا تحصيل في هذه الفترة</p></div>`;
    openModal("المتحصَّل ("+from+" → "+to+")", body);
    return;
  }
  if(kind==="teachers"){
    const list=paymentsInRange("teacher_payment").sort((a,b)=>payDateStr(b).localeCompare(payDateStr(a)));
    const body=list.length?list.map(p=>`
      <div class="list-item"><div>
        <div class="item-title">${sanitize(p.teacherName||"معلم")} · ${sanitize(p.groupName||"")}</div>
        <div class="item-meta">${money(p.amount)} ج · ${sanitize(payDateStr(p))}${p.note?" · "+sanitize(p.note):""}</div>
      </div></div>`).join(""):`<div class="empty-state"><p>لا مدفوعات معلمين في الفترة</p></div>`;
    openModal("مدفوع للمعلمين ("+from+" → "+to+")", body);
    return;
  }
  if(kind==="sessions"){
    const list=sessionsInRange().slice().reverse();
    const body=list.length?list.map(s=>{
      const g=cache.groups.find(x=>x.id===s.groupId);
      const t=cache.teachers.find(x=>x.id===s.teacherId);
      const p=(s.attendance||[]).filter(a=>a.status==="present").length;
      return `<div class="list-item"><div>
        <div class="item-title">${sanitize(s.date)} — ${sanitize(g?.name||"")}</div>
        <div class="item-meta">المعلم: ${sanitize(t?.name||"—")} · حاضر ${p}</div>
      </div></div>`;
    }).join(""):`<div class="empty-state"><p>لا جلسات في الفترة</p></div>`;
    openModal("جلسات الفترة ("+from+" → "+to+")", body);
    return;
  }
  if(kind==="profit"){
    const c=paymentsInRange("student_payment").reduce((s,p)=>s+Number(p.amount||0),0);
    const t=paymentsInRange("teacher_payment").reduce((s,p)=>s+Number(p.amount||0),0);
    openModal("ملخص الربح",`
      <div class="list-item ok"><div class="item-title">تحصيل طلاب</div><div class="item-meta">${money(c)} ج</div></div>
      <div class="list-item"><div class="item-title">صرف معلمين</div><div class="item-meta">${money(t)} ج</div></div>
      <div class="list-item ${c-t>=0?"ok":"due"}"><div class="item-title">الربح</div><div class="item-meta"><b>${money(c-t)} ج</b></div></div>
      <p style="font-size:12px;color:var(--muted);margin-top:8px">الفترة: ${sanitize(from)} → ${sanitize(to)}</p>`);
  }
}
function exportExcel(){
  if(!reportRange.from) defaultReportRange();
  const {from,to}=getReportRange();
  const stu=paymentsInRange("student_payment").map(p=>({النوع:"تحصيل",الاسم:p.studentName||"",المبلغ:p.amount,التاريخ:payDateStr(p),ملاحظة:p.note||""}));
  const tea=paymentsInRange("teacher_payment").map(p=>({النوع:"صرف معلم",الاسم:p.teacherName||"",المجموعة:p.groupName||"",المبلغ:p.amount,التاريخ:payDateStr(p),ملاحظة:p.note||""}));
  const sess=sessionsInRange().map(s=>{
    const g=cache.groups.find(x=>x.id===s.groupId);
    const t=cache.teachers.find(x=>x.id===s.teacherId);
    return {التاريخ:s.date,المجموعة:g?.name||"",المعلم:t?.name||"",حضور:(s.attendance||[]).filter(a=>a.status==="present").length};
  });
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(stu),"تحصيل");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(tea),"معلمين");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sess),"جلسات");
  XLSX.writeFile(wb,"center-report-"+from+"_to_"+to+".xlsx");
  toast("تم التصدير","ok");
}
const WIPE_MAP={
  sessions:{cols:["center_sessions"],label:"كل الجلسات"},
  students:{cols:["center_students"],label:"كل الطلاب"},
  teachers:{cols:["center_teachers"],label:"كل المعلمين"},
  payments:{cols:["center_payments"],label:"كل المدفوعات"},
  groups:{cols:["center_groups"],label:"كل المجموعات"},
  all:{cols:["center_sessions","center_students","center_teachers","center_payments","center_groups","center_schedule"],label:"جميع البيانات"}
};
function confirmWipe(kind){
  if(!requirePerm("wipeAll")) return;
  const conf=WIPE_MAP[kind];
  if(!conf) return;
  openModal("تأكيد المسح",`
    <p style="font-size:14px;line-height:1.7;margin-bottom:12px">سيتم حذف: <b style="color:var(--danger)">${conf.label}</b> من Firebase نهائياً.</p>
    <div class="form-group"><label>اكتب كلمة <b>مسح</b> للتأكيد</label><input id="wipeWord" placeholder="مسح" autocomplete="off"></div>
  `,`<button class="btn btn-outline btn-sm" onclick="closeModal()">إلغاء</button>
    <button class="btn btn-danger btn-sm" onclick="runWipe('${kind}')">تنفيذ المسح</button>`);
}
async function deleteCollectionDocs(colName){
  const snap=await db.collection(colName).get();
  const docs=snap.docs,CHUNK=400;
  for(let i=0;i<docs.length;i+=CHUNK){
    const batch=db.batch();
    docs.slice(i,i+CHUNK).forEach(d=>batch.delete(d.ref));
    await batch.commit();
  }
  return docs.length;
}
async function runWipe(kind){
  if(!requirePerm("wipeAll")) return;
  const conf=WIPE_MAP[kind];
  if(!conf) return;
  if(($("wipeWord")?.value||"").trim()!=="مسح"){toast("اكتب كلمة مسح بالضبط","err");return}
  try{
    showLoading("جاري المسح...");
    let total=0;
    for(const col of conf.cols){try{total+=await deleteCollectionDocs(col)}catch(e){console.warn(col,e)}}
    if(kind==="sessions"||kind==="all") cache.sessions=[];
    if(kind==="students"||kind==="all") cache.students=[];
    if(kind==="teachers"||kind==="all") cache.teachers=[];
    if(kind==="payments"||kind==="all") cache.payments=[];
    if(kind==="groups"||kind==="all") cache.groups=[];
    if(kind==="all") cache.schedule=[];
    closeModal();hideLoading();toast("تم المسح: "+total+" سجل","ok");goPage("home");
  }catch(e){hideLoading();toast("تعذر المسح: "+(e.message||e),"err")}
}
</script>
</body>
</html>
